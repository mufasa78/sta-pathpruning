[project]
name = "sta-path-pruning"
version = "1.0.0"
description = "STA Path Pruning - ML-based Endpoint-Oriented Path Pruning for Circuit Timing Analysis"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["static-timing-analysis", "machine-learning", "circuit-design", "eda", "path-pruning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "streamlit>=1.51.0",
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "networkx>=3.0",
    "matplotlib>=3.6.0",
    "plotly>=5.0.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sta_pruning*"]
